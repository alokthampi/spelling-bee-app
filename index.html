<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f13" />
  <title>Spelling Bee Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0d0f13;
      --bg-elevated: #14171d;
      --bg-inset: #1a1e26;
      --border: #262b34;
      --border-strong: #323844;
      --text: #e5e7eb;
      --text-secondary: #9ca3af;
      --text-tertiary: #6b7280;
      --accent: #6366f1;
      --accent-hover: #7c7ff2;
      --accent-soft: rgba(99, 102, 241, 0.14);
      --success: #34d399;
      --success-soft: rgba(52, 211, 153, 0.14);
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.16);
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.28);
      --tap: 44px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html { color-scheme: dark; }

    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      -webkit-text-size-adjust: 100%;
    }

    .container {
      max-width: 1180px;
      margin: auto;
    }

    h1 {
      font-size: clamp(19px, 3vw, 24px);
      font-weight: 800;
      margin: 4px 0 16px;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    /* ---------- Filter bar ---------- */
    .difficulty-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: end;
      background: var(--bg-elevated);
      padding: 14px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      margin-bottom: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .field-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-tertiary);
      padding-left: 1px;
    }

    .difficulty-bar select,
    .search-box {
      background-color: var(--bg-inset);
      color: var(--text);
      padding: 11px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      font-size: 16px;
      font-family: inherit;
      min-height: var(--tap);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
    }

    .multi-select {
      position: relative;
    }

    .multi-select summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: var(--tap);
      padding: 11px 12px;
      background: var(--bg-inset);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      list-style: none;
      font-size: 16px;
    }

    .multi-select summary::-webkit-details-marker { display: none; }
    .multi-select summary::after { content: "▾"; color: var(--text-secondary); }
    .multi-select[open] summary { border-color: var(--accent); }

    .multi-select-menu {
      position: absolute;
      z-index: 10;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      display: grid;
      gap: 4px;
      padding: 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
    }

    .multi-select-option {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 4px 6px;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text);
      font-size: 14px;
    }

    .multi-select-option:hover { background: var(--bg-inset); }
    .multi-select-option input { width: 17px; height: 17px; accent-color: var(--accent); }

    .correction-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: var(--tap);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .correction-toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .correction-note {
      width: 100%;
      min-height: 76px;
      resize: vertical;
      background: var(--bg-inset);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
    }

    .correction-note:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .difficulty-bar select {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6' fill='none'><path d='M1 1L5 5L9 1' stroke='%239ca3af' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat: no-repeat;
      background-position: right 12px center;
      padding-right: 30px;
    }

    .difficulty-bar select:focus,
    .search-box:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .reset-btn {
      background: var(--bg-inset);
      color: var(--text);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 10px 14px;
      line-height: 1;
      min-height: var(--tap);
      white-space: nowrap;
      transition: background 0.15s ease, border-color 0.15s ease;
      touch-action: manipulation;
    }

    .reset-btn:hover { background: #20242d; border-color: var(--accent); }
    .reset-btn:active { background: #262b34; }

    /* ---------- Progress ---------- */
    .progress-panel {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }

    .category-count {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .progress-track {
      height: 8px;
      border-radius: 999px;
      background: var(--bg-inset);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    /* ---------- Letter filters ---------- */
    .letter-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      grid-column: 1 / -1;
      padding-top: 2px;
    }

    .letter-btn {
      padding: 0;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-inset);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      touch-action: manipulation;
    }

    .letter-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .letter-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* ---------- Layout ---------- */
    .layout {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .word-list {
      position: relative;
      background: var(--bg-elevated);
      padding: 12px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      max-height: 34vh;
      overflow-y: auto;
    }

    .word-list::-webkit-scrollbar { width: 8px; }
    .word-list::-webkit-scrollbar-track { background: transparent; }
    .word-list::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 8px;
    }
    .word-list::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

    .word-list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .word-list-header h3 {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .shuffle-btn {
      position: static;
      padding: 6px 10px;
      font-size: 13px;
      min-height: 36px;
    }

    .word-item {
      padding: 12px;
      margin-bottom: 3px;
      font-size: 15px;
      font-weight: 500;
      border-radius: var(--radius-sm);
      border-left: 3px solid transparent;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease;
      touch-action: manipulation;
    }

    .word-item:hover {
      background: var(--bg-inset);
    }

    .word-item.correct {
      background: var(--success-soft);
      border-left-color: var(--success);
      color: #d7fbea;
    }

    .word-item.active {
      background: var(--accent-soft);
      border-left-color: var(--accent);
      color: #c7c8fb;
      font-weight: 700;
    }

    .word-item.wrong {
      background: var(--danger-soft) !important;
      border-left-color: var(--danger) !important;
      color: #ffdcdc !important;
    }

    .card {
      background: var(--bg-elevated);
      padding: 16px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    #word {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .mark-buttons,
    .audio-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .audio-buttons button,
    .mark-buttons button {
      flex: 1;
      min-width: 130px;
      min-height: var(--tap);
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      cursor: pointer;
      color: white;
      background: var(--accent);
      transition: background 0.15s ease;
      touch-action: manipulation;
    }

    .audio-buttons button:hover,
    .mark-buttons button:hover { background: var(--accent-hover); }
    .audio-buttons button:active,
    .mark-buttons button:active { background: #4f52d6; }

    .mark-buttons .correct { background: var(--success); color: #06281a; }
    .mark-buttons .correct:hover { background: #4de3ac; }

    .mark-buttons .wrong { background: var(--danger); color: #2b0a0a; }
    .mark-buttons .wrong:hover { background: #ff8b8b; }

    .audio-buttons button:disabled {
      background: var(--bg-inset);
      color: var(--text-tertiary);
      border-color: var(--border);
      cursor: not-allowed;
    }

    .label {
      margin-top: 14px;
      margin-bottom: 4px;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-tertiary);
    }

    #difficulty, #origin, #pos {
      font-size: 14px;
      color: var(--text);
    }

    #definition, #sentence {
      font-size: 14px;
      line-height: 1.55;
      color: var(--text);
      background: var(--bg-inset);
      border-left: 3px solid var(--accent);
      padding: 10px 12px;
      border-radius: var(--radius-sm);
    }

    /* ---------- Tabs ---------- */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 12px;
      width: fit-content;
    }

    .tab-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 9px 18px;
      min-height: 38px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      touch-action: manipulation;
    }

    .tab-btn:hover { color: var(--text); }

    .tab-btn.active {
      background: var(--accent);
      color: white;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ---------- Stats ---------- */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-tile {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }

    .stat-filter {
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .stat-filter:hover,
    .stat-filter:focus-visible {
      border-color: var(--accent);
      background: var(--bg-inset);
      outline: none;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-tertiary);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
    }

    .stat-section {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }

    .stat-section h3 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stack-bar {
      display: flex;
      height: 20px;
      gap: 2px;
      border-radius: 6px;
      overflow: hidden;
      background: var(--bg-inset);
    }

    .stack-seg {
      height: 100%;
    }

    .stack-seg.seg-correct { background: var(--success); }
    .stack-seg.seg-wrong { background: var(--danger); }
    .stack-seg.seg-empty { background: var(--border-strong); }

    .stack-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .legend-item strong {
      color: var(--text);
      font-weight: 700;
    }

    .mini-bars {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .mini-bar-row-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .mini-bar-row-header .mini-bar-title {
      font-weight: 700;
      color: var(--text);
    }

    .mini-bar-row-header .mini-bar-caption {
      color: var(--text-tertiary);
      font-size: 12px;
    }

    .mini-bar-track {
      display: flex;
      height: 12px;
      gap: 2px;
      border-radius: 5px;
      overflow: hidden;
      background: var(--bg-inset);
    }

    /* ---------- Responsive breakpoints ---------- */
    /* Small phones */
    @media (max-width: 380px) {
      .letter-btn { width: 30px; height: 32px; font-size: 12px; }
    }

    /* Larger phones / phablets */
    @media (min-width: 480px) {
      .difficulty-bar { grid-template-columns: 1fr 1fr; }
      .field:nth-child(4) { grid-column: 1 / -1; }
    }

    /* Tablets portrait (iPad mini/Air/Pro portrait ~744-1024px) and up */
    @media (min-width: 700px) {
      .difficulty-bar { grid-template-columns: repeat(4, 1fr); }
      .field:nth-child(4) { grid-column: auto; }
      .word-list { max-height: 42vh; }
      .stat-grid { grid-template-columns: repeat(4, 1fr); }
    }

    /* Tablet landscape / small laptop and up: side-by-side layout */
    @media (min-width: 900px) {
      .layout { flex-direction: row; gap: 16px; }
      .word-list { flex: 1; max-height: 60vh; }
      .card { flex: 2; }
      .shuffle-btn { position: absolute; top: 10px; right: 10px; }
      .word-list-header { padding-right: 90px; }
    }

    /* Laptop / desktop */
    @media (min-width: 1024px) {
      body { padding: 24px; }
      h1 { margin-bottom: 20px; }
    }
  </style>
</head>

<body>
<div class="container">
  <h1>🐝 Nikku's Spelling Bee Practice</h1>

  <div class="tabs">
    <button class="tab-btn active" data-tab="practice">Practice</button>
    <button class="tab-btn" data-tab="stats">Stats</button>
  </div>

  <div id="practiceTab" class="tab-panel active">
  <div class="difficulty-bar">
    <div class="field">
      <label class="field-label" for="scopeFilter">Scope</label>
      <details class="multi-select" id="scopeFilter">
        <summary>Regional</summary>
        <div class="multi-select-menu">
          <label class="multi-select-option"><input type="checkbox" value="regional" checked />Regional</label>
          <label class="multi-select-option"><input type="checkbox" value="school" />School</label>
        </div>
      </details>
    </div>

    <div class="field">
      <label class="field-label" for="difficultyFilter">Difficulty</label>
      <details class="multi-select" id="difficultyFilter">
        <summary>All Bees</summary>
        <div class="multi-select-menu">
          <label class="multi-select-option"><input type="checkbox" value="one" checked />One Bee 🐝</label>
          <label class="multi-select-option"><input type="checkbox" value="two" checked />Two Bee 🐝🐝</label>
          <label class="multi-select-option"><input type="checkbox" value="three" checked />Three Bee 🐝🐝🐝</label>
        </div>
      </details>
    </div>

    <div class="field">
      <label class="field-label" for="resultFilter">Results</label>
      <select id="resultFilter">
        <option value="all">All Results</option>
        <option value="correct">Correct</option>
        <option value="wrong">Wrong</option>
        <option value="correction">Marked for correction</option>
      </select>
    </div>

    <div class="field">
      <label class="field-label" for="searchInput">Search</label>
      <input id="searchInput" class="search-box" placeholder="🔍 Search words" />
    </div>

    <div class="letter-filter" id="letterFilter"></div>
  </div>

  <div class="progress-panel">
    <div id="categoryCount" class="category-count"></div>
    <div class="progress-track">
      <div id="progressBarFill" class="progress-bar-fill"></div>
    </div>
    <div id="progressText" class="progress-text"></div>
  </div>

  <div class="layout">
    <div class="word-list">
      <div class="word-list-header">
        <h3>Word List</h3>
        <button
          id="shuffleBtn"
          class="reset-btn shuffle-btn"
          style="display:none;"
          onclick="shuffleFilteredWords()"
        >
          🔀 Shuffle
        </button>
      </div>

      <div id="wordList"></div>
    </div>

    <div class="card">
      <h2 id="word">Select a word</h2>

      <div class="mark-buttons">
        <button class="correct" onclick="markAnswer('correct')">✅ Correct</button>
        <button class="wrong" onclick="markAnswer('wrong')">❌ Wrong</button>
        <button class="reset-btn desktop-only" onclick="clearResult()">↩️ Clear</button>
      </div>

      <div class="audio-buttons">
        <button id="mwPronunciationBtn" onclick="playMWPronunciation()" disabled>
          🔊 Dictionary
        </button>
        <button onclick="playAmericanPronunciation()">🗣️ American</button>
      </div>

      <div class="audio-buttons">
        <button onclick="readDefinition()">▶️ Definition</button>
        <button onclick="readSentence()">▶️ Sentence</button>
      </div>

      <div class="label">Difficulty</div>
      <div id="difficulty">—</div>

      <div class="label">Origin</div>
      <div id="origin">—</div>

      <div class="label">Definition</div>
      <div id="definition">—</div>

      <div class="label">Sentence</div>
      <div id="sentence">—</div>

      <div class="label">Part of Speech</div>
      <div id="pos">—</div>

      <label class="correction-toggle" for="correctionCheckbox">
        <input id="correctionCheckbox" type="checkbox" />
        <span>Mark for correction</span>
      </label>
      <textarea
        id="correctionNote"
        class="correction-note"
        placeholder="Describe the issue"
        aria-label="Correction issue description"
        disabled
      ></textarea>
    </div>
  </div>

  <div style="margin-top:20px;text-align:center;">
    <button class="reset-btn" style="width:100%;max-width:400px;" onclick="confirmReset()">
      ♻️ Start Over
    </button>
  </div>
  </div>

  <div id="statsTab" class="tab-panel">
    <div class="stat-grid" id="statGrid"></div>

    <div class="stat-section">
      <h3>Overall progress</h3>
      <div class="stack-bar" id="statsOverallBar"></div>
      <div class="stack-legend" id="statsOverallLegend"></div>
    </div>

    <div class="stat-section">
      <h3>By difficulty</h3>

<!-- 🔤 Multi-letter logic -->
<script>
  window.selectedLetters = new Set();

  function renderLetterFilter() {
    const container = document.getElementById("letterFilter");
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(letter => {
      const btn = document.createElement("button");
      btn.textContent = letter;
      btn.className = "letter-btn";

      btn.onclick = () => {
        btn.classList.toggle("active");
        if (window.selectedLetters.has(letter)) {
          window.selectedLetters.delete(letter);
        } else {
          window.selectedLetters.add(letter);
        }
        applyFilters();
      };

      container.appendChild(btn);
    });
  }

  document.addEventListener("DOMContentLoaded", renderLetterFilter);
</script>
